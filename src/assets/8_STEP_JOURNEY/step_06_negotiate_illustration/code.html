<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <rect width="800" height="500" rx="16" fill="#F8FAFC"/>
  <defs>
    <pattern id="grid_v6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#grid_v6)"/>

  <!-- Step 06: Negotiate (Bilateral Term Parity & Balancing) -->
  <g transform="translate(140, 60)">
    <!-- Scale / Balance Mechanism in center -->
    <line x1="260" y1="50" x2="260" y2="280" stroke="#0F172A" stroke-width="3"/>
    <circle cx="260" cy="50" r="8" fill="#0F172A"/>
    <line x1="120" y1="90" x2="400" y2="90" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Left Balance Pan: Offer Terms -->
    <g transform="translate(30, 100)">
      <line x1="90" y1="-10" x2="25" y2="40" stroke="#64748B" stroke-width="1.5"/>
      <line x1="90" y1="-10" x2="155" y2="40" stroke="#64748B" stroke-width="1.5"/>
      
      <!-- Left Card (Party A Offer) -->
      <rect x="15" y="40" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(15,23,42,0.06))"/>
      <rect x="30" y="56" width="70" height="10" rx="5" fill="#0F172A"/>
      <rect x="30" y="74" width="120" height="6" rx="3" fill="#64748B"/>
      
      <rect x="30" y="94" width="130" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="40" y="112" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="700">PROPOSED TERMS</text>
      <text x="40" y="126" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10">20% Rev Share / Lead</text>

      <rect x="30" y="146" width="130" height="26" rx="6" fill="#F1F5F9"/>
      <text x="95" y="163" fill="#475569" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" text-anchor="middle">OFFER #1</text>
    </g>

    <!-- Right Balance Pan: Counter-Offer Terms -->
    <g transform="translate(310, 100)">
      <line x1="90" y1="-10" x2="25" y2="40" stroke="#64748B" stroke-width="1.5"/>
      <line x1="90" y1="-10" x2="155" y2="40" stroke="#64748B" stroke-width="1.5"/>
      
      <!-- Right Card (Party B Counter) -->
      <rect x="15" y="40" width="160" height="150" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(15,23,42,0.06))"/>
      <rect x="30" y="56" width="80" height="10" rx="5" fill="#0F172A"/>
      <rect x="30" y="74" width="120" height="6" rx="3" fill="#64748B"/>
      
      <rect x="30" y="94" width="130" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="40" y="112" fill="#0F172A" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="700">COUNTER TERMS</text>
      <text x="40" y="126" fill="#64748B" font-family="Plus Jakarta Sans, sans-serif" font-size="10">15% Net + Co-Sell Pact</text>

      <rect x="30" y="146" width="130" height="26" rx="6" fill="#0F172A"/>
      <text x="95" y="163" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTIVE TURN</text>
    </g>

    <!-- Center Fulcrum Balance Base -->
    <polygon points="260,260 240,290 280,290" fill="#0F172A"/>

    <!-- Bottom Status -->
    <rect x="165" y="340" width="190" height="34" rx="17" fill="#0F172A"/>
    <text x="260" y="362" fill="#FFFFFF" font-family="Plus Jakarta Sans, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">RECIPROCAL CALIBRATION</text>
  </g>
</svg>
