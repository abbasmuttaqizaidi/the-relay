<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">

      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stroke_tech" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3"/>

  </defs>

  <rect x="12" y="12" width="176" height="176" rx="40" fill="url(#bg_tech)"/>

  <!-- Technology & Infrastructure Emblem: Server cluster rack stack integrating neural circuit bus channels and cloud node routing -->
  <g transform="translate(100, 100)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Server Blade 1 (Top) -->
    <rect x="-38" y="-36" width="76" height="18" rx="5" fill="#334155" stroke="#F8FAFC" stroke-width="2.5"/>
    <circle cx="-26" cy="-27" r="2.5" fill="#10B981"/>
    <line x1="-16" y1="-27" x2="26" y2="-27" stroke="#64748B" stroke-width="2"/>

    <!-- Server Blade 2 (Middle) -->
    <rect x="-38" y="-9" width="76" height="18" rx="5" fill="#334155" stroke="#F8FAFC" stroke-width="2.5"/>
    <circle cx="-26" cy="0" r="2.5" fill="#10B981"/>
    <line x1="-16" y1="0" x2="26" y2="0" stroke="#64748B" stroke-width="2"/>

    <!-- Server Blade 3 (Bottom) -->
    <rect x="-38" y="18" width="76" height="18" rx="5" fill="#334155" stroke="#F8FAFC" stroke-width="2.5"/>
    <circle cx="-26" cy="27" r="2.5" fill="#10B981"/>
    <line x1="-16" y1="27" x2="26" y2="27" stroke="#64748B" stroke-width="2"/>

    <!-- Interconnected Bus Traces / Infrastructure Backbone on Right -->
    <path d="M 44 -27 H 52 V 27 H 44" stroke="#94A3B8" stroke-width="2.5"/>
    <line x1="44" y1="0" x2="52" y2="0" stroke="#94A3B8" stroke-width="2.5"/>

    <path d="M -44 -27 H -52 V 27 H -44" stroke="#94A3B8" stroke-width="2.5"/>
