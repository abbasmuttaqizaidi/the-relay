<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg_prod" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stroke_prod" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="176" height="176" rx="40" fill="url(#bg_prod)"/>
  <rect x="12" y="12" width="176" height="176" rx="40" stroke="url(#stroke_prod)" stroke-width="1.5"/>

  <!-- Product Strategy Emblem: Strategic roadmap compass reticle & modular product blueprint quadrant -->
  <g transform="translate(100, 100)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Circular Strategy Compass Reticle Outer Frame -->
    <circle cx="0" cy="0" r="42" stroke="#475569" stroke-width="2.5" stroke-dasharray="4 4"/>
    
    <!-- 4 Modular Product Component Blocks (North, South, East, West Architecture) -->
    <!-- Core Hub -->
    <circle cx="0" cy="0" r="10" fill="#F8FAFC"/>
    
    <!-- North Strategy Arrow -->
    <path d="M 0 -10 V -36 M -6 -28 L 0 -38 L 6 -28" stroke="#F8FAFC" stroke-width="4.5"/>
    
    <!-- East Roadmap Branch -->
    <path d="M 10 0 H 32" stroke="#94A3B8" stroke-width="4"/>
    <circle cx="34" cy="0" r="4.5" fill="#94A3B8"/>
    
    <!-- South Architecture Branch -->
    <path d="M 0 10 V 32" stroke="#64748B" stroke-width="4"/>
    <circle cx="0" cy="34" r="4.5" fill="#64748B"/>
    
    <!-- West Execution Branch -->
    <path d="M -10 0 H -32" stroke="#94A3B8" stroke-width="4"/>
    <circle cx="-34" cy="0" r="4.5" fill="#94A3B8"/>
  </g>
</svg>
