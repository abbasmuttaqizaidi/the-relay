<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bg_gtm" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stroke_gtm" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="176" height="176" rx="40" fill="url(#bg_gtm)"/>
  <rect x="12" y="12" width="176" height="176" rx="40" stroke="url(#stroke_gtm)" stroke-width="1.5"/>

  <!-- Go-to-Market Emblem: High-velocity market penetration rocket / supersonic launch chevron breaking through radial market horizon -->
  <g transform="translate(100, 100)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Radial Market Waves / Horizon Rings -->
    <path d="M -44 26 C -20 40 20 40 44 26" stroke="#475569" stroke-width="2.5"/>
    <path d="M -34 10 C -16 20 16 20 34 10" stroke="#64748B" stroke-width="2.5"/>

    <!-- High Velocity Launch Chevron / GTM Rocket Vector -->
    <!-- Main Aerodynamic Body -->
    <path d="M 0 -42 L 20 12 L 0 2 L -20 12 Z" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Left Wing Booster -->
    <path d="M -20 12 L -34 26 L -16 22 Z" fill="#64748B"/>
    <!-- Right Wing Booster -->
    <path d="M 20 12 L 34 26 L 16 22 Z" fill="#94A3B8"/>
    <!-- Thrust Energy Plume -->
    <path d="M -6 16 L 0 34 L 6 16" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
