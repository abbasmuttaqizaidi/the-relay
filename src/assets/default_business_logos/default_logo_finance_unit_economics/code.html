<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">

    <!-- Bar 3 (Peak Margin / Yield) -->
    <rect x="2" y="-30" width="14" height="66" rx="4" fill="#F8FAFC" stroke="#FFFFFF" stroke-width="1.5"/>

    <path d="M 34 -32 V -16 M 30 -28 H 38 M 30 -20 H 38" stroke="#F8FAFC" stroke-width="2.5"/>

    <!-- Subtle Trending Margin Arc -->
    <path d="M -38 4 C -20 -18 4 -40 24 -40" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="3 3"/>
